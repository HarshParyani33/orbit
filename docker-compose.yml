services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orbit_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: orbit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment or .env}
      ORBIT_APP_PASSWORD: ${ORBIT_APP_PASSWORD:-orbit_app_pass}
      ORBIT_MIGRATOR_PASSWORD: ${ORBIT_MIGRATOR_PASSWORD:-orbit_migrator_pass}
      ORBIT_INGRESS_PASSWORD: ${ORBIT_INGRESS_PASSWORD:-orbit_ingress_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
